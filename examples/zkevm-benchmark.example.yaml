# benchmarkoor run configuration template for a zkVM proving benchmark. Copy
# and fill in the placeholders. The cluster is deployed separately with
# provoor up, and this run executes on the coordinator host so witness
# transfer stays off the measured network path. Fixtures resolve inside the
# run through the eest_fixtures source, exactly as for execution clients.
global:
  log_level: info

runner:
  client_logs_to_stdout: true
  container_network: benchmarkoor
  cleanup_on_start: false
  # The forwarder listens only after guest setup, which on a cold cluster
  # runs a one-time keygen taking several minutes.
  ready_timeout: 15m

  benchmark:
    results_dir: ./results
    # The forwarder container does almost no work, so resource samples would
    # misreport an idle container while the GPU hosts are saturated.
    system_resource_collection_enabled: false
    tests:
      metadata:
        labels:
          name: "zkVM stateless validation"
      source:
        eest_fixtures:
          # Remote release usage. The release ships fixtures_benchmark.tar.gz
          # and needs no genesis for stateless fixtures.
          github_repo: han0110/execution-specs
          github_release: tests-zkevm-benchmark@v0.6.2
          # Local directory usage, pointing at an extracted fixtures tree.
          # local_fixtures_dir: /path/to/fixtures
          fixtures_subdir: fixtures/blockchain_tests

  # One entry per deployed cluster, delete the rest. The guest ELF flag takes
  # a local path or an ere-guests release asset URL, and for openvm it must
  # be byte-identical to the cluster configuration's guests entry.
  instances:
    - id: ethrex-zisk
      client: provoor
      image: ghcr.io/han0110/provoor:latest
      metadata:
        labels:
          zkvm: zisk
          guest: ethrex
      extra_args:
        - --zkvm=zisk
        - --guest=ethrex
        - --guest-elf=https://github.com/eth-act/ere-guests/releases/download/v0.15.0/stateless-validator-ethrex-zisk-v1.0.0-alpha.elf
        - --cluster-endpoint=http://<coordinator-ip>:7000
    - id: ethrex-openvm
      client: provoor
      image: ghcr.io/han0110/provoor:latest
      metadata:
        labels:
          zkvm: openvm
          guest: ethrex
      extra_args:
        - --zkvm=openvm
        - --guest=ethrex
        - --guest-elf=https://github.com/eth-act/ere-guests/releases/download/v0.15.0/stateless-validator-ethrex-openvm-v2.1.0-preview.elf
        - --cluster-endpoint=http://<coordinator-ip>:3000
