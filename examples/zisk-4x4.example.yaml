zkvm: zisk
zkvm_version: 1.2.0-alpha

guests:
  - elf: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.2.0-alpha.elf
    vk: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.2.0-alpha.vk
  - elf: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.2.0-alpha.elf
    vk: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-ethrex-zisk-v1.2.0-alpha.vk
  - elf: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-zesu-zisk-v1.2.0-alpha.elf
    vk: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-zesu-zisk-v1.2.0-alpha.vk

coordinator:
  ssh: ${NODE1_SSH}
  ip: ${NODE1_IP}

workers:
  - { ssh: "${NODE1_SSH}", gpu: { device_ids: [0, 1, 2, 3] } }
  - { ssh: "${NODE2_SSH}", gpu: { device_ids: [0, 1, 2, 3] } }
  - { ssh: "${NODE3_SSH}", gpu: { device_ids: [0, 1, 2, 3] } }
  - { ssh: "${NODE4_SSH}", gpu: { device_ids: [0, 1, 2, 3] } }

telemetry:
  sidecars:
    - ssh: ${NODE1_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE1_SSH}
      kind: node-exporter
    - ssh: ${NODE2_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE2_SSH}
      kind: node-exporter
    - ssh: ${NODE3_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE3_SSH}
      kind: node-exporter
    - ssh: ${NODE4_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE4_SSH}
      kind: node-exporter
