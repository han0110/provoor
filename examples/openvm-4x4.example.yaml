# OpenVM cluster across four hosts with four GPUs each, one worker container
# per GPU for sixteen in total. Placeholders are filled from .env by
# scripts/provoor.sh, so real addresses stay out of version control.
zkvm: openvm

# provoor up downloads each guests entry, pushes the ELF bytes to every host,
# and checks the cluster's derived key against the vk published beside it.
guests:
  - elf: https://github.com/eth-act/ere-guests/releases/download/v0.16.0/stateless-validator-reth-openvm-v2.1.0-preview.elf
    vk: https://github.com/eth-act/ere-guests/releases/download/v0.16.0/stateless-validator-reth-openvm-v2.1.0-preview.vk
  - elf: https://github.com/eth-act/ere-guests/releases/download/v0.16.0/stateless-validator-ethrex-openvm-v2.1.0-preview.elf
    vk: https://github.com/eth-act/ere-guests/releases/download/v0.16.0/stateless-validator-ethrex-openvm-v2.1.0-preview.vk
  - elf: https://github.com/han0110/zesu-zkvm/releases/download/glamsterdam-devnet-7/stateless-validator-zesu-openvm-v2.1.0-preview.elf
    vk: https://github.com/han0110/zesu-zkvm/releases/download/glamsterdam-devnet-7/stateless-validator-zesu-openvm-v2.1.0-preview.vk

coordinator:
  name: node1
  ssh: ${NODE1_SSH}
  ip: ${NODE1_IP}

# One entry per worker container, position is the prover id.
workers:
  - name: node1
    ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 0
  - name: node1
    ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 1
  - name: node1
    ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 2
  - name: node1
    ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 3
  - name: node2
    ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 0
  - name: node2
    ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 1
  - name: node2
    ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 2
  - name: node2
    ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 3
  - name: node3
    ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 0
  - name: node3
    ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 1
  - name: node3
    ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 2
  - name: node3
    ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 3
  - name: node4
    ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 0
  - name: node4
    ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 1
  - name: node4
    ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 2
  - name: node4
    ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 3

config:
  # 14.5 GiB sits under OpenVM's built-in cap with headroom for the CUDA
  # pool, two concurrent app provers at the cap can exhaust a 32 GB card.
  segment_memory: 15569256448
