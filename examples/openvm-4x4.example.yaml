zkvm: openvm
zkvm_version: 2.1.0-preview

guests:
  - elf: https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-reth-openvm-v2.1.0-preview.elf
    vk: https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-reth-openvm-v2.1.0-preview.vk
  - elf: https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-ethrex-openvm-v2.1.0-preview.elf
    vk: https://github.com/eth-act/ere-guests/releases/download/v0.17.0/stateless-validator-ethrex-openvm-v2.1.0-preview.vk

coordinator:
  ssh: ${NODE1_SSH}
  ip: ${NODE1_IP}

workers:
  - { ssh: "${NODE1_SSH}", ip: "${NODE1_IP}", gpu: { device_ids: [0] } }
  - { ssh: "${NODE1_SSH}", ip: "${NODE1_IP}", gpu: { device_ids: [1] } }
  - { ssh: "${NODE1_SSH}", ip: "${NODE1_IP}", gpu: { device_ids: [2] } }
  - { ssh: "${NODE1_SSH}", ip: "${NODE1_IP}", gpu: { device_ids: [3] } }
  - { ssh: "${NODE2_SSH}", ip: "${NODE2_IP}", gpu: { device_ids: [0] } }
  - { ssh: "${NODE2_SSH}", ip: "${NODE2_IP}", gpu: { device_ids: [1] } }
  - { ssh: "${NODE2_SSH}", ip: "${NODE2_IP}", gpu: { device_ids: [2] } }
  - { ssh: "${NODE2_SSH}", ip: "${NODE2_IP}", gpu: { device_ids: [3] } }
  - { ssh: "${NODE3_SSH}", ip: "${NODE3_IP}", gpu: { device_ids: [0] } }
  - { ssh: "${NODE3_SSH}", ip: "${NODE3_IP}", gpu: { device_ids: [1] } }
  - { ssh: "${NODE3_SSH}", ip: "${NODE3_IP}", gpu: { device_ids: [2] } }
  - { ssh: "${NODE3_SSH}", ip: "${NODE3_IP}", gpu: { device_ids: [3] } }
  - { ssh: "${NODE4_SSH}", ip: "${NODE4_IP}", gpu: { device_ids: [0] } }
  - { ssh: "${NODE4_SSH}", ip: "${NODE4_IP}", gpu: { device_ids: [1] } }
  - { ssh: "${NODE4_SSH}", ip: "${NODE4_IP}", gpu: { device_ids: [2] } }
  - { ssh: "${NODE4_SSH}", ip: "${NODE4_IP}", gpu: { device_ids: [3] } }

config:
  # Use 14.5 GiB for safety margin to avoid prover VRAM OOM.
  segment_memory: 15569256448

telemetry:
  sidecars:
    - ssh: ${NODE1_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE1_SSH}
      kind: node-exporter
    - ssh: ${NODE2_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE2_SSH}
      kind: node-exporter
    - ssh: ${NODE3_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE3_SSH}
      kind: node-exporter
    - ssh: ${NODE4_SSH}
      kind: dcgm-exporter
      nv_hostengine: 127.0.0.1:5555
    - ssh: ${NODE4_SSH}
      kind: node-exporter
