zkvm: openvm
zkvm_version: 2.1.0-preview

guests:
  - elf: https://github.com/paradigmxyz/stateless/releases/download/reth-guest-v0.1.0-rc.2/stateless-validator-reth-openvm-v2.1.0-preview.elf
    vk: https://github.com/paradigmxyz/stateless/releases/download/reth-guest-v0.1.0-rc.2/stateless-validator-reth-openvm-v2.1.0-preview.vk
  - elf: https://github.com/lambdaclass/ethrex/releases/download/v26.0.0-rc.2/stateless-validator-ethrex-openvm-v2.1.0-preview.elf
    vk: https://github.com/lambdaclass/ethrex/releases/download/v26.0.0-rc.2/stateless-validator-ethrex-openvm-v2.1.0-preview.vk
  # - elf: https://github.com/han0110/zesu-zkvm/releases/download/glamsterdam-devnet-7/stateless-validator-zesu-openvm-v2.1.0-preview.elf
  #   vk: https://github.com/han0110/zesu-zkvm/releases/download/glamsterdam-devnet-7/stateless-validator-zesu-openvm-v2.1.0-preview.vk

coordinator:
  ssh: ${NODE1_SSH}
  ip: ${NODE1_IP}

workers:
  - ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 0
  - ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 1
  - ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 2
  - ssh: ${NODE1_SSH}
    ip: ${NODE1_IP}
    gpu: 3
  - ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 0
  - ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 1
  - ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 2
  - ssh: ${NODE2_SSH}
    ip: ${NODE2_IP}
    gpu: 3
  - ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 0
  - ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 1
  - ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 2
  - ssh: ${NODE3_SSH}
    ip: ${NODE3_IP}
    gpu: 3
  - ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 0
  - ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 1
  - ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 2
  - ssh: ${NODE4_SSH}
    ip: ${NODE4_IP}
    gpu: 3

config:
  # Use 14.5 GiB for safety margin to avoid prover VRAM OOM.
  segment_memory: 15569256448

telemetry:
  sidecars:
    - ssh: ${NODE1_SSH}
      kind: dcgm-exporter
    - ssh: ${NODE1_SSH}
      kind: node-exporter
    - ssh: ${NODE2_SSH}
      kind: dcgm-exporter
    - ssh: ${NODE2_SSH}
      kind: node-exporter
    - ssh: ${NODE3_SSH}
      kind: dcgm-exporter
    - ssh: ${NODE3_SSH}
      kind: node-exporter
    - ssh: ${NODE4_SSH}
      kind: dcgm-exporter
    - ssh: ${NODE4_SSH}
      kind: node-exporter
