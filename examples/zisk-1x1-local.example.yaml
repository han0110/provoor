# The coordinator, one worker on GPU 0, and both sidecars on the local Docker daemon, which an omitted ssh selects.
# The DCGM sidecar embeds its host engine, so the host needs no nvidia-dcgm.service.
zkvm: zisk
zkvm_version: 1.2.0-alpha

guests:
  - elf: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.2.0-alpha.elf
    vk: https://raw.githubusercontent.com/han0110/provoor/refs/heads/main/elfs/stateless-validator-reth-zisk-v1.2.0-alpha.vk

workers:
  - { gpu: { device_ids: [0] } }

telemetry:
  sidecars:
    - kind: dcgm-exporter
    - kind: node-exporter
