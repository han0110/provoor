name: publish-zkvm-image

on:
  workflow_dispatch:
    inputs:
      zkvm:
        description: zkVM whose cluster image is built and published
        required: true
        type: choice
        options:
          - openvm
          - zisk

permissions:
  contents: read

concurrency:
  group: publish-zkvm-image-${{ inputs.zkvm }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          ZKVM: ${{ inputs.zkvm }}
        run: |
          case "${ZKVM}" in
            openvm)
              echo "tag=2.1.0-preview" >> "${GITHUB_OUTPUT}"
              echo "build-args=RUSTFLAGS=" >> "${GITHUB_OUTPUT}"
              ;;
            zisk)
              echo "tag=1.1.0-alpha" >> "${GITHUB_OUTPUT}"
              echo "build-args=" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dockers/zkvm/Dockerfile.${{ inputs.zkvm }}
          push: true
          build-args: ${{ steps.image.outputs.build-args }}
          tags: ghcr.io/${{ github.repository }}/${{ inputs.zkvm }}:${{ steps.image.outputs.tag }}
