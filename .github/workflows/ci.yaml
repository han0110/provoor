name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/fetch-verifier.sh
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: docker build -f dockers/Dockerfile .
