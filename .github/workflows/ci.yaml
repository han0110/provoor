name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # internal/cluster checks its field list against the collector in the submodule.
      - run: git submodule update --init benchmarkoor
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # TODO: Temporary. Run scripts/fetch-verifier.sh again after an ere release
      # verifies ZisK 1.3.0-alpha proofs, and remove lib_override.
      - run: cp -r internal/ereverifier/lib_override internal/ereverifier/lib
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: docker build -f dockers/Dockerfile .
